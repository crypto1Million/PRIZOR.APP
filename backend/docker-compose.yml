version: '3.9'

services:

  app:
    build: .
    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: prizor

    ports:
      - "5432:5432"

  redis:
    image: redis:7

    ports:
      - "6379:6379"